<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZKMEER Enterprise Meet - Secure Live Call</title>
    <!-- PeerJS CDN for Live WebRTC Video Calling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #05070d;
            color: #f1f5f9;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            background-image: radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.05) 0%, transparent 45%),
                              radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.05) 0%, transparent 45%);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .screen.active {
            display: flex;
        }

        .lobby-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
        }

        .lobby-card {
            background: rgba(13, 19, 32, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 580px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            max-height: 90vh;
            overflow-y: auto;
        }

        .lobby-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 5px; }

        .form-control {
            width: 100%;
            background: rgba(5, 7, 13, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .form-control:focus { border-color: #0ea5e9; }

        .row-inputs { display: flex; gap: 10px; }

        .btn-primary {
            width: 100%;
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-primary:hover { background: #0284c7; }

        .scheduled-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 15px;
        }
        .scheduled-section h3 { font-size: 13px; color: #94a3b8; margin-bottom: 10px; }

        .meeting-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }
        .meeting-info h4 { font-size: 13px; color: #f1f5f9; }
        .meeting-info p { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        .meeting-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .action-btn { padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-copy { background: #64748b; color: white; }
        .btn-join { background: #0ea5e9; color: white; }

        .app-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        header {
            height: 60px;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
        }

        .brand { display: flex; align-items: center; gap: 10px; }

        .logo-badge {
            background: linear-gradient(135deg, #0ea5e9, #4f46e5);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.35);
            flex-shrink: 0;
        }

        .logo-badge svg { width: 18px; height: 18px; fill: #ffffff; }

        .brand h1 {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .header-meta { display: flex; align-items: center; gap: 8px; }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.08);
            color: #34d399;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-dot { width: 6px; height: 6px; background-color: #34d399; border-radius: 50%; }
        .timer-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 5px 10px; border-radius: 20px; font-size: 12px; color: #94a3b8; }

        .workspace { flex: 1; display: flex; padding: 12px; gap: 15px; position: relative; overflow: hidden; }

        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            justify-content: center;
            align-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding-bottom: 70px;
            overflow-y: auto;
        }

        .video-card {
            position: relative;
            background: #090e18;
            border-radius: 14px;
            overflow: hidden;
            width: 100%;
            max-height: 100%;
            aspect-ratio: 16/10;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .blur-bg { filter: blur(16px); }

        .card-footer {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .user-tag { background: rgba(10, 14, 23, 0.8); backdrop-filter: blur(10px); padding: 4px 10px; border-radius: 6px; font-size: 11px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .hand-badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; padding: 4px 8px; border-radius: 6px; font-size: 11px; display: none; border: 1px solid rgba(251, 191, 36, 0.3); }

        .control-dock-wrapper { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 20; width: 95%; max-width: 600px; display: flex; justify-content: center; }
        .control-dock { background: rgba(13, 19, 32, 0.9); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); width: 100%; overflow-x: auto; }
        .dock-btn { background: rgba(255, 255, 255, 0.04); color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.06); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .dock-btn svg { width: 16px; height: 16px; fill: #f1f5f9; }
        .dock-btn.active { background: #0ea5e9; border-color: #38bdf8; }
        .dock-btn.danger { background: #ef4444; border-color: #f87171; }
        .divider { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.1); margin: 0 2px; flex-shrink: 0; }

        .chat-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 100%; max-width: 320px; background: rgba(10, 15, 25, 0.95); backdrop-filter: blur(20px); border-left: 1px solid rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; display: none; z-index: 25; }
        .chat-header { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .chat-bubble { background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 10px; max-width: 85%; }
        .chat-input-area { padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.06); display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: rgba(5, 7, 13, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 8px; color: white; outline: none; font-size: 13px; }
        .send-btn { background: #0ea5e9; color: white; border: none; padding: 0 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .reactions-container { position: absolute; bottom: 80px; left: 20px; pointer-events: none; display: flex; flex-direction: column; gap: 8px; z-index: 25; }
        .floating-reaction { font-size: 28px; animation: floatUpEffect 2s forwards; }
        @keyframes floatUpEffect { 0% { transform: translateY(0) scale(0.4); opacity: 0; } 20% { transform: translateY(-20px) scale(1.2); opacity: 1; } 100% { transform: translateY(-120px) scale(1); opacity: 0; } }

        .popup-tray { position: absolute; bottom: 75px; background: rgba(13, 19, 32, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 14px; border-radius: 25px; display: none; gap: 10px; z-index: 30; }
        .popup-tray span { cursor: pointer; font-size: 20px; }

        @media(min-width: 768px) {
            .brand h1 { max-width: 350px; font-size: 17px; }
            .control-dock { padding: 10px 18px; gap: 10px; width: auto; }
            .dock-btn { width: 44px; height: 44px; }
            .video-grid { padding-bottom: 0; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
            .chat-panel { position: relative; width: 340px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOBBY & SCHEDULER -->
    <div id="lobbyScreen" class="screen active">
        <div class="lobby-container">
            <div class="lobby-card">
                <div class="lobby-header">
                    <div class="logo-badge">
                        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    </div>
                    <div>
                        <h2>ZKMEER Scheduler</h2>
                        <p style="font-size:12px; color:#94a3b8;">Secure meetings with passwords</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>Meeting Title</label>
                    <input type="text" id="meetTitle" class="form-control" placeholder="e.g., Client Sync">
                </div>

                <div class="row-inputs">
                    <div class="form-group" style="flex:1;">
                        <label>Date</label>
                        <input type="date" id="meetDate" class="form-control">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Time</label>
                        <input type="time" id="meetTime" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Room Secret Password</label>
                    <input type="text" id="meetPass" class="form-control" placeholder="e.g., 123456">
                </div>

                <div class="form-group">
                    <label>WhatsApp Number (Optional if sharing manually)</label>
                    <input type="text" id="meetPhone" class="form-control" placeholder="923001234567">
                </div>

                <button class="btn-primary" onclick="scheduleMeeting()">Schedule & Generate Link</button>

                <div class="scheduled-section">
                    <h3>Saved Rooms</h3>
                    <div id="meetingsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: ACTIVE MEETING ROOM -->
    <div id="roomScreen" class="screen">
        <div class="app-layout">
            <header>
                <div class="brand">
                    <div class="logo-badge">
                        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    </div>
                    <h1 id="activeRoomTitle">ZKMEER Live</h1>
                </div>
                <div class="header-meta">
                    <div class="status-pill">
                        <div class="status-dot"></div>
                        <span id="connStatus">Connecting</span>
                    </div>
                    <div class="timer-box" id="callTimer">00:00</div>
                </div>
            </header>

            <div class="workspace">
                <div class="video-grid" id="videoGridContainer">
                    <div class="reactions-container" id="reactionsLayer"></div>
                    <div class="video-card">
                        <video id="localVideo" autoplay playsinline muted></video>
                        <div class="card-footer">
                            <div class="user-tag">👤 You</div>
                            <div class="hand-badge" id="localHandBadge">✋ Raised</div>
                        </div>
                    </div>
                    <div class="video-card">
                        <video id="remoteVideo" autoplay playsinline></video>
                        <div class="card-footer">
                            <div class="user-tag">👥 Participant</div>
                            <div class="hand-badge" id="remoteHandBadge">✋ Raised</div>
                        </div>
                    </div>
                </div>

                <div class="chat-panel" id="chatPanel">
                    <div class="chat-header">
                        <span>Meeting Chat</span>
                        <span style="cursor:pointer; color: #94a3b8; font-size:18px;" onclick="toggleChat()">✕</span>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-bubble">Secure encrypted meeting initialized.</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="msgInput" placeholder="Type message..." onkeypress="handleKey(event)">
                        <button class="send-btn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>

            <div class="popup-tray" id="emojiTray">
                <span onclick="triggerReaction('👍')">👍</span>
                <span onclick="triggerReaction('❤️')">❤️</span>
                <span onclick="triggerReaction('👏')">👏</span>
                <span onclick="triggerReaction('🔥')">🔥</span>
                <span onclick="triggerReaction('🚀')">🚀</span>
            </div>

            <div class="control-dock-wrapper">
                <div class="control-dock">
                    <button class="dock-btn" id="micBtn" onclick="toggleMic()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.23 14.47 16 12 16s-4.52-1.77-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg></button>
                    <button class="dock-btn" id="camBtn" onclick="toggleCam()"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
                    <button class="dock-btn" id="blurBtn" onclick="toggleBlur()"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7zm1-11h-2v6h2zm0 8h-2v2h2z"/></svg></button>
                    <div class="divider"></div>
                    <button class="dock-btn" id="screenBtn" onclick="toggleScreenShare()"><svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg></button>
                    <button class="dock-btn" id="recordBtn" onclick="toggleRecording()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
                    <button class="dock-btn" id="handBtn" onclick="toggleHandRaise()"><svg viewBox="0 0 24 24"><path d="M18 10h-1.26A5.978 5.978 0 0012 4a5.978 5.978 0 00-4.74 6H6c-1.1 0-2 .9-2 2v7c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-7c0-1.1-.9-2-2-2zm-6-4c1.66 0 3 1.34 3 3v1h-6V9c0-1.66 1.34-3 3-3zm6 15H6v-7h12v7z"/></svg></button>
                    <div class="divider"></div>
                    <button class="dock-btn" onclick="toggleEmojiTray()"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.47 2 12s4.47 10 9.99 10S22 17.53 22 12 17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
                    <button class="dock-btn" onclick="toggleChat()"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg></button>
                    <button class="dock-btn danger" onclick="leaveRoom()"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.18-.29-.43-.29-.71 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.66c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let peer;
        let meetings = JSON.parse(localStorage.getItem('zk_meetings')) || [];
        
        // Ensure old/saved items have a roomId
        meetings = meetings.map(m => {
            if (!m.roomId) {
                m.roomId = 'room-' + Math.random().toString(36).substring(2, 9);
            }
            return m;
        });

        function renderMeetings() {
            const listDiv = document.getElementById('meetingsList');
            if (meetings.length === 0) {
                listDiv.innerHTML = '<p style="font-size:12px; color:#64748b;">No scheduled meetings yet.</p>';
                return;
            }
            listDiv.innerHTML = '';
            meetings.forEach((m) => {
                listDiv.innerHTML += `
                    <div class="meeting-item">
                        <div class="meeting-info">
                            <h4>${m.title}</h4>
                            <p>📅 ${m.date} | 🔑 ${m.pass} | 📱 ${m.phone || 'N/A'}</p>
                        </div>
                        <div class="meeting-actions">
                            <button class="action-btn btn-whatsapp" onclick="sendWhatsApp('${m.title}', '${m.roomId}', '${m.pass}', '${m.phone}')">WA</button>
                            <button class="action-btn btn-copy" onclick="copyInvite('${m.title}', '${m.roomId}', '${m.pass}')">Copy</button>
                            <button class="action-btn btn-join" onclick="startHostRoom('${m.roomId}', '${m.title}')">Join</button>
                        </div>
                    </div>
                `;
            });
        }

        function scheduleMeeting() {
            const title = document.getElementById('meetTitle').value.trim();
            const date = document.getElementById('meetDate').value;
            const time = document.getElementById('meetTime').value;
            const pass = document.getElementById('meetPass').value.trim();
            const phone = document.getElementById('meetPhone').value.trim();

            if (!title || !date || !time || !pass) {
                alert("Please fill in meeting title, date, time and password!");
                return;
            }

            const roomId = 'room-' + Math.random().toString(36).substring(2, 9);
            meetings.push({ title, date, time, pass, phone, roomId });
            localStorage.setItem('zk_meetings', JSON.stringify(meetings));

            document.getElementById('meetTitle').value = '';
            document.getElementById('meetPass').value = '';
            document.getElementById('meetPhone').value = '';
            renderMeetings();
            alert("Secure meeting scheduled successfully!");
        }

        function sendWhatsApp(title, roomId, pass, phone) {
            const baseUrl = window.location.href.split('?')[0];
            const link = `${baseUrl}?room=${roomId}`;
            const text = `Hello! Join your secure ZKMEER meeting "${title}" using this link:\n${link}\n\n🔑 Meeting Password: *${pass}*`;
            
            navigator.clipboard.writeText(text);

            if (phone && phone.trim() !== "") {
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
            }
        }

        function copyInvite(title, roomId, pass) {
            const baseUrl = window.location.href.split('?')[0];
            const link = `${baseUrl}?room=${roomId}`;
            const text = `Hello! Join your secure ZKMEER meeting "${title}" using this link:\n${link}\n\n🔑 Meeting Password: ${pass}`;
            navigator.clipboard.writeText(text);
            alert("Meeting link & password copied to clipboard!");
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomToJoin = urlParams.get('room');
            if (roomToJoin) {
                const enteredPass = prompt("🔒 Enter Room Password:");
                if (!enteredPass) {
                    alert("Password is required to join!");
                    window.location.href = window.location.pathname;
                    return;
                }
                const participantName = prompt("Enter your name:", "Participant");
                startClientRoom(roomToJoin, enteredPass, participantName || "Live Participant");
            } else {
                renderMeetings();
            }
        });

        let localStream, activeCall, screenStream, mediaRecorder, timerInterval;
        let recordedChunks = [];
        let isSharingScreen = false, isRecording = false, isBlurred = false, isHandRaised = false;
        let seconds = 0;

        let localVideo = document.getElementById('localVideo');
        let remoteVideo = document.getElementById('remoteVideo');

        function startHostRoom(roomId, title) {
            document.getElementById('lobbyScreen').classList.remove('active');
            document.getElementById('roomScreen').classList.add('active');
            document.getElementById('activeRoomTitle').innerText = title + " (Host)";

            peer = new Peer(roomId);
            peer.on('open', (id) => {
                document.getElementById('connStatus').innerText = "Waiting...";
            });

            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    call.answer(stream);
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        document.getElementById('connStatus').innerText = "Connected";
                    });
                    activeCall = call;
                });
            });
            initCamOnly();
        }

        function startClientRoom(roomId, password, title) {
            document.getElementById('lobbyScreen').classList.remove('active');
            document.getElementById('roomScreen').classList.add('active');
            document.getElementById('activeRoomTitle').innerText = title;

            peer = new Peer();
            peer.on('open', () => {
                document.getElementById('connStatus').innerText = "Connecting...";
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    const call = peer.call(roomId, stream);
                    if(call) {
                        call.on('stream', (remoteStream) => {
                            remoteVideo.srcObject = remoteStream;
                            document.getElementById('connStatus').innerText = "Connected";
                        });
                        activeCall = call;
                    }
                }).catch(err => alert("Camera/Mic permission denied."));
            });
            
            peer.on('error', (err) => {
                alert("Connection error or incorrect room/password.");
                leaveRoom();
            });

            startTimer();
        }

        async function initCamOnly() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                startTimer();
            } catch (err) { alert("Camera/Mic permission required."); }
        }

        function startTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds / 60).toString().padStart(2, '0');
                let s = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('callTimer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function leaveRoom() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (activeCall) activeCall.close();
            if (peer) peer.destroy();
            clearInterval(timerInterval);
            window.location.href = window.location.pathname;
        }

        function toggleMic() {
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            document.getElementById('micBtn').classList.toggle('danger', !track.enabled);
        }

        function toggleCam() {
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            document.getElementById('camBtn').classList.toggle('danger', !track.enabled);
        }

        function toggleBlur() {
            isBlurred = !isBlurred;
            localVideo.classList.toggle('blur-bg', isBlurred);
            document.getElementById('blurBtn').classList.toggle('active', isBlurred);
        }

        async function toggleScreenShare() {
            const btn = document.getElementById('screenBtn');
            if (!isSharingScreen) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    localVideo.srcObject = screenStream;
                    isSharingScreen = true;
                    btn.classList.add('active');
                    screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
                } catch(e) {}
            } else { stopScreenShare(); }
        }

        function stopScreenShare() {
            if(screenStream) screenStream.getTracks().forEach(t => t.stop());
            localVideo.srcObject = localStream;
            isSharingScreen = false;
            document.getElementById('screenBtn').classList.remove('active');
        }

        function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            if (!isRecording) {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'zkmeer-recording.webm';
                    a.click();
                };
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('danger');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('danger');
            }
        }

        function toggleHandRaise() {
            isHandRaised = !isHandRaised;
            document.getElementById('localHandBadge').style.display = isHandRaised ? 'flex' : 'none';
            document.getElementById('handBtn').classList.toggle('active', isHandRaised);
        }

        function toggleEmojiTray() {
            const tray = document.getElementById('emojiTray');
            tray.style.display = tray.style.display === 'flex' ? 'none' : 'flex';
        }

        function triggerReaction(emoji) {
            const layer = document.getElementById('reactionsLayer');
            const span = document.createElement('span');
            span.className = 'floating-reaction';
            span.innerText = emoji;
            layer.appendChild(span);
            setTimeout(() => span.remove(), 2000);
            toggleEmojiTray();
        }

        function toggleChat() {
            const panel = document.getElementById('chatPanel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            if(input.value.trim() !== "") {
                const box = document.getElementById('chatMessages');
                const div = document.createElement('div');
                div.className = 'chat-bubble';
                div.style.background = '#0ea5e9';
                div.style.marginLeft = 'auto';
                div.innerText = input.value;
                box.appendChild(div);
                input.value = "";
                box.scrollTop = box.scrollHeight;
            }
        }

        function handleKey(e) { if(e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
